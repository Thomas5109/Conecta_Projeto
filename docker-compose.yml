services:
  postgres:
    image: postgres:18
    container_name: projeto-saude-postgres

    environment:
      POSTGRES_DB: projeto_saude
      POSTGRES_USER: saude_app
      POSTGRES_PASSWORD: saude_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: